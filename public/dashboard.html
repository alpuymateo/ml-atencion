<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundoshop — Panel de Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #060d1f;
  --surface: #0d1a35;
  --card:    #162040;
  --border:  rgba(255,255,255,0.09);
  --blue:    #00217E;
  --yellow:  #FFCA61;
  --text:    #ffffff;
  --muted:   rgba(255,255,255,0.55);
  --ok:      #10b981;
  --warn:    #f59e0b;
  --alert:   #f97316;
  --danger:  #ef4444;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ─── HEADER ─── */
header {
  background: var(--blue);
  padding: 0 40px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 3px solid var(--yellow);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 20px;
}
.header-left svg { height: 34px; width: auto; }
.header-sep { width: 1px; height: 26px; background: rgba(255,255,255,0.2); }
.header-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
}
.header-right {
  display: flex;
  align-items: center;
  gap: 28px;
}
.header-clock {
  text-align: right;
}
#hdr-time {
  display: block;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .02em;
  color: white;
  line-height: 1.1;
}
#hdr-date {
  display: block;
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.4);
  letter-spacing: .04em;
  margin-top: 2px;
  text-transform: capitalize;
}
.refresh-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
}
.pulse-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--yellow);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
.refresh-badge strong { color: var(--yellow); font-weight: 800; }

/* ─── MAIN ─── */
main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr;
  gap: 16px;
  padding: 16px 20px;
  overflow: hidden;
  min-height: 0;
}

/* ─── MODULE ─── */
.module {
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.mod-header {
  padding: 12px 20px 11px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.mod-accent {
  width: 3px;
  height: 16px;
  border-radius: 99px;
  background: var(--yellow);
  flex-shrink: 0;
}
.mod-title {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--yellow);
}
.mod-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 14px 16px;
  gap: 10px;
  min-height: 0;
  overflow: hidden;
}

/* ─── KPI CARD ─── */
.kpi {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--sc, rgba(255,255,255,0.15));
  padding: 14px 18px;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
.kpi.warn   { --sc: var(--warn); }
.kpi.alert  { --sc: var(--alert); }
.kpi.danger { --sc: var(--danger); }

.kpi-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.kpi-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
}
.kpi-state {
  font-size: 8px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 2px 7px;
  border-radius: 99px;
  display: none;
}
.kpi.warn  .kpi-state { display:inline; background: rgba(245,158,11,.18); color: #f59e0b; }
.kpi.alert .kpi-state { display:inline; background: rgba(249,115,22,.18); color: #f97316; }
.kpi.danger .kpi-state { display:inline; background: rgba(239,68,68,.18); color: #ef4444; }

.kpi-value {
  font-size: 54px;
  font-weight: 900;
  line-height: 1;
  color: #ffffff;
  letter-spacing: -.03em;
}
.kpi-value.sm { font-size: 38px; letter-spacing: -.02em; }

.kpi-sub {
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.38);
  margin-top: 3px;
}

/* ─── VENTAS MODULE ─── */
.ventas-hero {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 18px 20px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}
.v-sup {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
  margin-bottom: 4px;
}
.v-count {
  font-size: 90px;
  font-weight: 900;
  line-height: 1;
  color: var(--yellow);
  letter-spacing: -.04em;
}
.v-date {
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.35);
  margin-top: 3px;
}
.ventas-right { text-align: right; }
.v-monto {
  font-size: 28px;
  font-weight: 800;
  color: white;
  letter-spacing: -.01em;
  line-height: 1;
}
.v-delta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  margin-top: 8px;
  padding: 3px 10px;
  border-radius: 99px;
}
.v-delta.up   { background: rgba(16,185,129,.15); color: #10b981; }
.v-delta.down { background: rgba(239,68,68,.15); color: #ef4444; }
.v-delta.flat { background: rgba(255,255,255,.06); color: rgba(255,255,255,.4); }
.v-ayer {
  display: block;
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  margin-top: 6px;
}

/* mini KPIs row */
.v-extras {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  flex-shrink: 0;
}
.mini-kpi {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 12px 16px;
}
.mini-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--muted);
  margin-bottom: 4px;
}
.mini-val {
  font-size: 30px;
  font-weight: 900;
  color: white;
  line-height: 1;
  letter-spacing: -.02em;
}
.mini-sub {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  margin-top: 3px;
}

/* ─── BAR CHART ─── */
.chart-wrap {
  flex: 1;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 14px 16px 10px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.chart-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--muted);
  margin-bottom: 10px;
  flex-shrink: 0;
}
.chart-inner {
  flex: 1;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  min-height: 0;
}
.bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
}
.bar-wrap {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
}
.bar {
  width: 100%;
  border-radius: 3px 3px 0 0;
  min-height: 3px;
  background: rgba(255,202,97,.25);
}
.bar.past   { background: rgba(255,202,97,.55); }
.bar.active { background: var(--yellow); }
.bar-val {
  font-size: 10px;
  font-weight: 700;
  color: white;
  margin-bottom: 3px;
  min-height: 14px;
  opacity: 0;
}
.bar-val.show { opacity: 1; }
.bar-lbl {
  font-size: 9px;
  font-weight: 600;
  color: rgba(255,255,255,0.3);
  margin-top: 4px;
}
.bar-lbl.active { color: var(--yellow); font-weight: 800; }

/* ─── WEBHOOKS STRIP ─── */
.webhooks-strip {
  flex-shrink: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 9px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wh-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: rgba(255,255,255,0.3);
  margin-right: 6px;
  white-space: nowrap;
}
.wh-item {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 5px 13px;
}
.wh-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.wh-dot.ok   { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
.wh-dot.warn { background: var(--warn); }
.wh-dot.dead { background: rgba(255,255,255,0.15); }
.wh-name {
  font-size: 10px;
  font-weight: 700;
  color: rgba(255,255,255,0.6);
}
.wh-time {
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.3);
}

/* ─── LOADING / ERROR ─── */
.full-msg {
  grid-column: span 3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
}
</style>
</head>

    <div class="wh-dot dead"></div>

    <span class="wh-time">—</span>
  </div>
  <div class="wh-item" id="wh-soydelivery">
    <div class="wh-dot dead"></div>
    <span class="wh-name">SoyDelivery</span>
    <span class="wh-time">—</span>
  </div>
</div>

<script>
const KEY   = new URLSearchParams(location.search).get('key') || '';
const TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('session_token') || '';

/* ── helpers ── */
function fmt(n)  { return (n || 0).toLocaleString('es-UY'); }
function fmtM(n) { return '$ ' + Math.round(n || 0).toLocaleString('es-UY'); }
function fmtMin(m) {
  if (!m) return '0m';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h}h ${r}m` : `${h}h`;
}
function st(v, thresh) {
  const [w,a,d] = thresh;
  if (v >= d) return 'danger';
  if (v >= a) return 'alert';
  if (v >= w) return 'warn';
  return '';
}
function stLabel(s) {
  return { warn:'Atención', alert:'Urgente', danger:'Crítico' }[s] || '';
}

/* ── webhooks strip ── */
function renderWebhooks(wh) {
  if (!wh) return;
  document.getElementById('webhooks-strip').style.display = '';
  const ahora = Date.now();
  [
    { id: 'wh-mercadolibre', ts: wh.mercadolibre },
    { id: 'wh-dac',          ts: wh.dac },
    { id: 'wh-deri',         ts: wh.deri },
    { id: 'wh-soydelivery',  ts: wh.soydelivery },
  ].forEach(({ id, ts }) => {
    const el = document.getElementById(id);
    if (!el) return;
    const dot  = el.querySelector('.wh-dot');
    const time = el.querySelector('.wh-time');
    if (!ts) { dot.className = 'wh-dot dead'; time.textContent = 'sin eventos'; return; }
    const mins = Math.floor((ahora - new Date(ts).getTime()) / 60000);
    const label = mins < 1 ? 'ahora' : mins < 60 ? `hace ${mins}m` : `hace ${Math.floor(mins/60)}h ${mins%60}m`;
    dot.className = 'wh-dot ' + (mins < 30 ? 'ok' : mins < 120 ? 'warn' : 'dead');
    time.textContent = label;
  });
}

/* ── clock ── */
function tickClock() {
  const now = new Date();
  document.getElementById('hdr-time').textContent =
    now.toLocaleTimeString('es-UY', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  document.getElementById('hdr-date').textContent =
    now.toLocaleDateString('es-UY', { weekday:'long', day:'2-digit', month:'long' });
}
setInterval(tickClock, 1000);
tickClock();

/* ── render ── */
function renderDashboard(d) {
  const T  = d.thresholds || {};
  const sP = st(d.preguntas_sin_responder, T.preguntas || [1, 3, 6]);
  const sD = st(d.demora_maxima_min,       T.demora    || [15, 60, 120]);
  const sM = st(d.mensajes_sin_leer,       T.mensajes  || [1, 3, 5]);
  const sR = st(d.reclamos_abiertos,       T.reclamos  || [1, 2, 4]);
  const sE = st(d.pendientes_despacho,     T.despacho  || [1, 4, 8]);

  renderWebhooks(d.webhooks);

  /* delta */
  const delta = d.delta_ventas || 0;
  let deltaClass = 'flat', deltaIcon = '—', deltaText = 'igual que ayer';
  if (delta > 0) { deltaClass='up';   deltaIcon='▲'; deltaText=`+${fmt(delta)} vs ayer`; }
  if (delta < 0) { deltaClass='down'; deltaIcon='▼'; deltaText=`${fmt(delta)} vs ayer`; }

  /* chart */
  const vph    = d.ventas_por_hora || Array(10).fill(0);
  const maxV   = Math.max(...vph, 1);
  const curHr  = new Date().getHours();
  const curIdx = curHr - 9;

  const barsHtml = vph.map((v, i) => {
    const hr  = 9 + i;
    const pct = Math.round((v / maxV) * 100);
    const cls = i === curIdx ? 'active' : hr < curHr ? 'past' : '';
    return `
      <div class="bar-col">
        <div class="bar-val ${v > 0 ? 'show' : ''}">${v || ''}</div>
        <div class="bar-wrap"><div class="bar ${cls}" style="height:${Math.max(pct,3)}%"></div></div>
        <div class="bar-lbl ${i === curIdx ? 'active' : ''}">${hr}h</div>
      </div>`;
  }).join('');

  const dpSub = d.demora_promedio_min ? `promedio ${fmtMin(d.demora_promedio_min)}` : 'sin demoras activas';
  const pph   = d.ventas_hoy && curIdx > 0 ? (d.ventas_hoy / Math.max(curIdx, 1)).toFixed(1) : '—';
  const montoAyer = fmtM((d.monto_hoy || 0) - (delta || 0));

  function kpi(state, label, value, sub, smallVal) {
    return `
      <div class="kpi ${state}">
        <div class="kpi-top">
          <div class="kpi-label">${label}</div>
          ${state ? `<div class="kpi-state">${stLabel(state)}</div>` : ''}
        </div>
        <div class="kpi-value${smallVal ? ' sm' : ''}">${value}</div>
        <div class="kpi-sub">${sub}</div>
      </div>`;
  }

  document.getElementById('main-grid').innerHTML = `

    <!-- ATENCIÓN -->
    <div class="module">
      <div class="mod-header">
        <div class="mod-accent"></div>
        <span class="mod-title">Atención al cliente</span>
      </div>
      <div class="mod-body">
        ${kpi(sP, 'Preguntas sin responder',    fmt(d.preguntas_sin_responder), 'MercadoLibre')}
        ${kpi(sD, 'Demora máxima de respuesta', fmtMin(d.demora_maxima_min),    dpSub, d.demora_maxima_min >= 60)}
        ${kpi(sM, 'Mensajes post-venta sin leer', fmt(d.mensajes_sin_leer),     'conversaciones pendientes')}
        ${kpi(sR, 'Reclamos abiertos',           fmt(d.reclamos_abiertos),      'requieren atención')}
      </div>
    </div>

    <!-- VENTAS -->
    <div class="module">
      <div class="mod-header">
        <div class="mod-accent"></div>
        <span class="mod-title">Ventas del día</span>
      </div>
      <div class="mod-body">

        <div class="ventas-hero">
          <div>
            <div class="v-sup">Órdenes pagadas hoy</div>
            <div class="v-count">${fmt(d.ventas_hoy)}</div>
            <div class="v-date">${new Date().toLocaleDateString('es-UY',{day:'2-digit',month:'long'})}</div>
          </div>
          <div class="ventas-right">
            <div class="v-monto">${fmtM(d.monto_hoy)}</div>
            <span class="v-delta ${deltaClass}">${deltaIcon} ${deltaText}</span>
            <span class="v-ayer">Ayer: ${fmt(d.ventas_ayer)} · ${montoAyer}</span>
          </div>
        </div>

        <div class="v-extras">
          <div class="mini-kpi">
            <div class="mini-label">Entregados hoy</div>
            <div class="mini-val">${fmt(d.entregados_hoy)}</div>
            <div class="mini-sub">envíos completados</div>
          </div>
          <div class="mini-kpi">
            <div class="mini-label">Promedio por hora</div>
            <div class="mini-val">${pph}</div>
            <div class="mini-sub">ventas / hora hábil</div>
          </div>
        </div>

        <div class="chart-wrap">
          <div class="chart-label">Ventas por hora — hoy</div>
          <div class="chart-inner">${barsHtml}</div>
        </div>

      </div>
    </div>

    <!-- LOGÍSTICA -->
    <div class="module">
      <div class="mod-header">
        <div class="mod-accent"></div>
        <span class="mod-title">Logística</span>
      </div>
      <div class="mod-body">
        ${kpi(sE, 'Pendientes de despacho', fmt(d.pendientes_despacho), 'sin enviar aún')}
        ${kpi('',  'En camino',             fmt(d.en_camino),           'DAC · SoyDelivery · Robert')}
        ${kpi('',  'Entregados hoy',        fmt(d.entregados_hoy),      'completados')}
      </div>
    </div>
  `;
}

/* ── fetch ── */
async function fetchData() {
  try {
    const headers = TOKEN ? { 'Authorization': `Bearer ${TOKEN}` } : {};
    const r = await fetch(`/api/dashboard-data?key=${encodeURIComponent(KEY)}`, { headers });
    if (!r.ok) {
      document.getElementById('main-grid').innerHTML =
        '<div class="full-msg" style="color:#ef4444;">Sin acceso — verificá la clave en la URL (?key=…)</div>';
      return;
    }
    const d = await r.json();
    if (d.loading) return;
    renderDashboard(d);
  } catch(e) { console.error(e); }
}

/* ── countdown ── */
let cd = 60;
setInterval(() => {
  cd--;
  document.getElementById('countdown').textContent = cd;
  if (cd <= 0) { cd = 60; fetchData(); }
}, 1000);

fetchData();
</script>
</body>
</html>
