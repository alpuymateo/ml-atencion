<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUNDO SHOP — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #f0f2f5;
    color: #1a1d23;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: linear-gradient(135deg, #001560 0%, #00217E 100%);
    padding: 16px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,33,126,0.25);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-logo-text {
    font-size: 20px;
    font-weight: 800;
    color: white;
    letter-spacing: .02em;
  }
  .header-logo-text span {
    color: #FFCA61;
  }
  .header-divider {
    width: 1px; height: 28px;
    background: rgba(255,255,255,0.2);
  }
  .header-subtitle {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    font-weight: 500;
  }
  .header-clock {
    font-size: 15px;
    font-weight: 700;
    color: white;
  }
  .refresh-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
  }
  .refresh-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #FFCA61;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  main {
    flex: 1;
    padding: 28px 32px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    align-content: start;
  }

  .kpi-card {
    background: white;
    border-radius: 14px;
    padding: 24px 26px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    border: 1px solid #ebebeb;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent, #00217E);
  }
  /* Estados */
  .kpi-card.ok     { --accent: #16a34a; }
  .kpi-card.warn   { --accent: #d97706; }
  .kpi-card.alert  { --accent: #ea580c; }
  .kpi-card.danger { --accent: #dc2626; }

  .kpi-card.warn   { background: #fffbeb; border-color: #fde68a; }
  .kpi-card.alert  { background: #fff7ed; border-color: #fed7aa; }
  .kpi-card.danger { background: #fef2f2; border-color: #fecaca; }

  .kpi-icon { font-size: 26px; margin-bottom: 14px; display: block; }
  .kpi-label {
    font-size: 11px;
    font-weight: 700;
    color: #9ca3af;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
    color: #1a1d23;
    margin-bottom: 6px;
  }
  .kpi-card.warn   .kpi-value { color: #92400e; }
  .kpi-card.alert  .kpi-value { color: #9a3412; }
  .kpi-card.danger .kpi-value { color: #991b1b; }

  .kpi-sub {
    font-size: 12px;
    color: #9ca3af;
    font-weight: 500;
  }

  /* Card ancha (ventas) */
  .kpi-card.wide {
    grid-column: span 2;
  }
  .kpi-card.wide .kpi-value { font-size: 64px; }
  .wide-row {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .wide-monto {
    font-size: 32px;
    font-weight: 700;
    color: #00217E;
    padding-bottom: 4px;
  }

  footer {
    text-align: center;
    padding: 14px;
    font-size: 11px;
    color: #b0b8c4;
    font-weight: 500;
    border-top: 1px solid #e5e7eb;
    background: white;
  }

  .loading-msg {
    grid-column: span 4;
    text-align: center;
    padding: 80px;
    font-size: 16px;
    color: #9ca3af;
    font-weight: 500;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-logo-text">MUNDO <span>SHOP</span></div>
    <div class="header-divider"></div>
    <div class="header-subtitle">Panel de operaciones</div>
  </div>
  <div class="header-right">
    <div class="header-clock" id="fecha-hora">—</div>
    <div class="refresh-pill">
      <div class="refresh-dot"></div>
      Actualiza en <strong style="color:white;margin-left:4px;" id="countdown">60</strong>s
    </div>
    <div id="last-update" style="font-size:12px;">—</div>
  </div>
</header>

<main id="main-grid">
  <div class="loading-msg">Cargando datos...</div>
</main>

<footer>
  MUNDO SHOP · Dashboard interno · Los datos se actualizan automáticamente cada 60 segundos
</footer>

<script>
  const KEY = new URLSearchParams(location.search).get('key') || '';

  function fmt(n)       { return (n || 0).toLocaleString('es-UY'); }
  function fmtMonto(n)  { return '$\u00a0' + Math.round(n || 0).toLocaleString('es-UY'); }
  function fmtDemora(m) {
    if (!m) return '0m';
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60), rem = m % 60;
    return rem ? `${h}h ${rem}m` : `${h}h`;
  }

  function estado(value, thresholds) {
    if (value >= thresholds[2]) return 'danger';
    if (value >= thresholds[1]) return 'alert';
    if (value >= thresholds[0]) return 'warn';
    return 'ok';
  }

  function renderGrid(d) {
    const ePreg  = estado(d.preguntas_sin_responder, [1, 3, 6]);
    const eDem   = estado(d.demora_maxima_min,       [15, 60, 120]);
    const eMsg   = estado(d.mensajes_sin_leer,       [1, 3, 5]);
    const eRec   = estado(d.reclamos_abiertos,       [1, 2, 4]);
    const eDesp  = estado(d.pendientes_despacho,     [1, 4, 8]);

    const upd = d.updated_at
      ? new Date(d.updated_at).toLocaleTimeString('es-UY', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
      : '—';
    document.getElementById('last-update').textContent = `Datos al ${upd}`;

    document.getElementById('main-grid').innerHTML = `
      <div class="kpi-card ${ePreg}">
        <span class="kpi-icon">💬</span>
        <div class="kpi-label">Preguntas sin responder</div>
        <div class="kpi-value">${fmt(d.preguntas_sin_responder)}</div>
        <div class="kpi-sub">MercadoLibre · sin respuesta</div>
      </div>

      <div class="kpi-card ${eDem}">
        <span class="kpi-icon">⏱️</span>
        <div class="kpi-label">Demora máxima de respuesta</div>
        <div class="kpi-value" style="font-size:${d.demora_maxima_min >= 60 ? '42px' : '56px'};">${fmtDemora(d.demora_maxima_min)}</div>
        <div class="kpi-sub">horas hábiles · peor caso activo</div>
      </div>

      <div class="kpi-card ${eMsg}">
        <span class="kpi-icon">📨</span>
        <div class="kpi-label">Mensajes post-venta sin leer</div>
        <div class="kpi-value">${fmt(d.mensajes_sin_leer)}</div>
        <div class="kpi-sub">conversaciones pendientes</div>
      </div>

      <div class="kpi-card ${eRec}">
        <span class="kpi-icon">⚠️</span>
        <div class="kpi-label">Reclamos abiertos</div>
        <div class="kpi-value">${fmt(d.reclamos_abiertos)}</div>
        <div class="kpi-sub">requieren atención</div>
      </div>

      <div class="kpi-card ${eDesp}">
        <span class="kpi-icon">📦</span>
        <div class="kpi-label">Pedidos pendientes de despacho</div>
        <div class="kpi-value">${fmt(d.pendientes_despacho)}</div>
        <div class="kpi-sub">sin enviar aún</div>
      </div>

      <div class="kpi-card ok">
        <span class="kpi-icon">🚚</span>
        <div class="kpi-label">Envíos en camino</div>
        <div class="kpi-value">${fmt(d.en_camino)}</div>
        <div class="kpi-sub">DAC · SoyDelivery · Robert</div>
      </div>

      <div class="kpi-card ok wide">
        <span class="kpi-icon">🛒</span>
        <div class="kpi-label">Ventas de hoy</div>
        <div class="wide-row">
          <div class="kpi-value">${fmt(d.ventas_hoy)}</div>
          <div class="wide-monto">${fmtMonto(d.monto_hoy)}</div>
        </div>
        <div class="kpi-sub">órdenes pagadas hoy · monto total</div>
      </div>
    `;
  }

  async function fetchData() {
    try {
      const r = await fetch(`/api/dashboard-data?key=${encodeURIComponent(KEY)}`);
      if (!r.ok) {
        document.getElementById('main-grid').innerHTML =
          '<div class="loading-msg" style="color:#dc2626;">Sin acceso — verificá la clave en la URL (?key=...)</div>';
        return;
      }
      const d = await r.json();
      if (d.loading) return;
      renderGrid(d);
    } catch(e) { console.error(e); }
  }

  // Reloj en tiempo real
  function tickClock() {
    const now = new Date();
    document.getElementById('fecha-hora').textContent =
      now.toLocaleDateString('es-UY', { weekday:'long', day:'2-digit', month:'2-digit' }) + ' · ' +
      now.toLocaleTimeString('es-UY', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  setInterval(tickClock, 1000);
  tickClock();

  // Countdown + refresh
  let countdown = 60;
  setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) { countdown = 60; fetchData(); }
  }, 1000);

  fetchData();
</script>
</body>
</html>
