<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundoshop — Panel de Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #f5f6fa;
    color: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: #00217E;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .header-logo svg { height: 38px; width: auto; }
  .header-divider {
    width: 1px; height: 32px;
    background: rgba(255,255,255,0.25);
  }
  .header-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .header-clock {
    font-size: 15px;
    font-weight: 700;
    color: white;
    letter-spacing: .02em;
  }
  .refresh-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
  }
  .refresh-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #FFCA61;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .refresh-pill strong { color: #FFCA61; }
  .last-update {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
  }

  /* ── Grid ── */
  main {
    flex: 1;
    padding: 32px 40px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    align-content: start;
  }

  /* ── Cards ── */
  .card {
    background: white;
    border-radius: 12px;
    padding: 28px 28px 24px;
    border: 1.5px solid #e8eaf0;
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--top, #00217E);
    border-radius: 12px 12px 0 0;
  }

  /* Estados */
  .card.ok     { --top: #00217E; }
  .card.warn   { --top: #FFCA61; background: #fffdf0; border-color: #fde68a; }
  .card.alert  { --top: #f97316; background: #fff8f5; border-color: #fed7aa; }
  .card.danger { --top: #dc2626; background: #fff5f5; border-color: #fecaca; }

  .card-icon { font-size: 24px; margin-bottom: 16px; display: block; }
  .card-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: #9ca3af;
    margin-bottom: 10px;
  }
  .card.warn   .card-label { color: #92400e; }
  .card.alert  .card-label { color: #9a3412; }
  .card.danger .card-label { color: #991b1b; }

  .card-value {
    font-size: 60px;
    font-weight: 800;
    line-height: 1;
    color: #00217E;
    margin-bottom: 8px;
  }
  .card.warn   .card-value { color: #92400e; }
  .card.alert  .card-value { color: #c2410c; }
  .card.danger .card-value { color: #b91c1c; }

  .card-sub {
    font-size: 12px;
    font-weight: 500;
    color: #b0b8c4;
  }
  .card.warn   .card-sub,
  .card.alert  .card-sub,
  .card.danger .card-sub { opacity: .6; }

  /* Card ancha — ventas */
  .card.wide { grid-column: span 2; }
  .card.wide .card-value { font-size: 68px; }
  .ventas-row {
    display: flex;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }
  .ventas-monto {
    font-size: 34px;
    font-weight: 700;
    color: #FFCA61;
    padding-bottom: 6px;
    /* sombra para legibilidad sobre blanco */
    text-shadow: 0 1px 0 rgba(0,0,0,.08);
  }
  .card.wide .card-sub { margin-top: 4px; }

  /* Loading / error */
  .loading-msg {
    grid-column: span 4;
    text-align: center;
    padding: 80px;
    font-size: 15px;
    font-weight: 600;
    color: #9ca3af;
  }

  /* ── Footer ── */
  footer {
    background: white;
    border-top: 1px solid #e8eaf0;
    padding: 12px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 500;
    color: #c0c7d4;
  }
</style>
</head>
<body>

    </svg>
    <div class="header-divider"></div>
    <div class="header-label">Panel de operaciones</div>
  </div>

  <div class="header-right">
    <div class="header-clock" id="fecha-hora">—</div>
    <div class="refresh-pill">
      <div class="refresh-dot"></div>
      Actualiza en <strong id="countdown">60</strong>s
    </div>
    <div class="last-update" id="last-update">—</div>
  </div>
</header>

<main id="main-grid">
  <div class="loading-msg">Cargando datos...</div>
</main>

<footer>
  <span>Mundoshop · Panel interno · Actualización automática cada 60 segundos</span>
  <span id="footer-status">—</span>
</footer>

<script>
  const KEY = new URLSearchParams(location.search).get('key') || '';

  function fmt(n)      { return (n || 0).toLocaleString('es-UY'); }
  function fmtMonto(n) { return '$ ' + Math.round(n || 0).toLocaleString('es-UY'); }
  function fmtDemora(m) {
    if (!m) return '0m';
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}h ${r}m` : `${h}h`;
  }
  function estado(v, [w, a, d]) {
    if (v >= d) return 'danger';
    if (v >= a) return 'alert';
    if (v >= w) return 'warn';
    return 'ok';
  }

  function renderGrid(d) {
    const eP = estado(d.preguntas_sin_responder, [1, 3, 6]);
    const eD = estado(d.demora_maxima_min,       [15, 60, 120]);
    const eM = estado(d.mensajes_sin_leer,       [1, 3, 5]);
    const eR = estado(d.reclamos_abiertos,       [1, 2, 4]);
    const eE = estado(d.pendientes_despacho,     [1, 4, 8]);

    const upd = d.updated_at
      ? new Date(d.updated_at).toLocaleTimeString('es-UY', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
      : '—';
    document.getElementById('last-update').textContent = `Datos al ${upd}`;
    document.getElementById('footer-status').textContent = `Última actualización: ${upd}`;

    document.getElementById('main-grid').innerHTML = `
      <div class="card ${eP}">
        <span class="card-icon">💬</span>
        <div class="card-label">Preguntas sin responder</div>
        <div class="card-value">${fmt(d.preguntas_sin_responder)}</div>
        <div class="card-sub">MercadoLibre · sin respuesta</div>
      </div>

      <div class="card ${eD}">
        <span class="card-icon">⏱️</span>
        <div class="card-label">Demora máxima de respuesta</div>
        <div class="card-value" style="font-size:${d.demora_maxima_min >= 60 ? '44px' : '60px'};">${fmtDemora(d.demora_maxima_min)}</div>
        <div class="card-sub">horas hábiles · peor caso activo</div>
      </div>

      <div class="card ${eM}">
        <span class="card-icon">📨</span>
        <div class="card-label">Mensajes post-venta sin leer</div>
        <div class="card-value">${fmt(d.mensajes_sin_leer)}</div>
        <div class="card-sub">conversaciones pendientes</div>
      </div>

      <div class="card ${eR}">
        <span class="card-icon">⚠️</span>
        <div class="card-label">Reclamos abiertos</div>
        <div class="card-value">${fmt(d.reclamos_abiertos)}</div>
        <div class="card-sub">requieren atención</div>
      </div>

      <div class="card ${eE}">
        <span class="card-icon">📦</span>
        <div class="card-label">Pedidos pendientes de despacho</div>
        <div class="card-value">${fmt(d.pendientes_despacho)}</div>
        <div class="card-sub">sin enviar aún</div>
      </div>

      <div class="card ok">
        <span class="card-icon">🚚</span>
        <div class="card-label">Envíos en camino</div>
        <div class="card-value">${fmt(d.en_camino)}</div>
        <div class="card-sub">DAC · SoyDelivery · Robert</div>
      </div>

      <div class="card ok wide">
        <span class="card-icon">🛒</span>
        <div class="card-label">Ventas de hoy</div>
        <div class="ventas-row">
          <div class="card-value">${fmt(d.ventas_hoy)}</div>
          <div class="ventas-monto">${fmtMonto(d.monto_hoy)}</div>
        </div>
        <div class="card-sub">órdenes pagadas hoy · monto total</div>
      </div>
    `;
  }

  async function fetchData() {
    try {
      const r = await fetch(`/api/dashboard-data?key=${encodeURIComponent(KEY)}`);
      if (!r.ok) {
        document.getElementById('main-grid').innerHTML =
          '<div class="loading-msg" style="color:#dc2626;">Sin acceso — verificá la clave en la URL (?key=...)</div>';
        return;
      }
      const d = await r.json();
      if (d.loading) return;
      renderGrid(d);
    } catch(e) { console.error(e); }
  }

  function tickClock() {
    document.getElementById('fecha-hora').textContent =
      new Date().toLocaleDateString('es-UY', { weekday:'long', day:'2-digit', month:'long' }) + '  ·  ' +
      new Date().toLocaleTimeString('es-UY', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  setInterval(tickClock, 1000);
  tickClock();

  let cd = 60;
  setInterval(() => {
    cd--;
    document.getElementById('countdown').textContent = cd;
    if (cd <= 0) { cd = 60; fetchData(); }
  }, 1000);

  fetchData();
</script>
</body>
</html>
